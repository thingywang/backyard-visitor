[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "backyard-visitor"
version = "0.9.4"
description = "A quiet visit from the cat next door."
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["PyQt6==6.9.1"]

[project.optional-dependencies]
dev = ["pytest>=8", "psutil>=5.9", "pyinstaller>=6"]
windows = ["pywin32>=306; sys_platform == 'win32'"]

[project.gui-scripts]
backyard-visitor = "backyard_visitor.app:main"

[tool.setuptools.package-data]
backyard_visitor = ["assets/*", "assets/compiled-sprites/*", "assets/depth-sprites/*", "assets/black-coat/*", "assets/parkour/*", "assets/coat-maps/*", "assets/portraits/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
